<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">招聘信息助手 — Job Search Assistant</title>
  <desc id="desc">项目文字封面。基于 RAG 与工具调用，让招聘资料可查询、可筛选、可核对。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5ff"/><stop offset="1" stop-color="#edf8f6"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1278" height="318" rx="24" fill="url(#background)" stroke="#dce5ee"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif" text-anchor="middle">
    <text x="640" y="55" font-size="13" font-weight="700" fill="#2455b6" letter-spacing="2">RAG + TOOL CALLING</text>
    <text x="640" y="131" font-size="56" font-weight="700" fill="#14293f">招聘信息助手</text>
    <text x="640" y="173" font-size="21" fill="#4c6481" letter-spacing="2">JOB SEARCH ASSISTANT</text>
    <text x="640" y="229" font-size="22" fill="#253d55">让招聘资料可查询、可筛选、可核对。</text>
    <text x="640" y="279" font-size="15" fill="#546b80">Vue 3 / FastAPI / BGE / Chroma / SQLite / DeepSeek</text>
  </g>
</svg>
