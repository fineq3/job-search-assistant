<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">招聘信息助手 — Job Search Assistant</title>
  <desc id="desc">基于 RAG 与工具调用，将招聘资料变成可查询、可筛选、可核对的知识库。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f5ff"/><stop offset="1" stop-color="#edf8f6"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#d9e3ec" stroke-width=".65"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#background)"/>
  <rect x="688" width="592" height="400" fill="url(#grid)" opacity=".65"/>
  <path d="M0 28Q0 0 28 0H1252Q1280 0 1280 28" fill="none" stroke="#d7e2ed"/>
  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <rect x="52" y="46" width="205" height="28" rx="14" fill="#dce7ff"/>
    <text x="69" y="65" font-size="12" font-weight="700" fill="#2455b6" letter-spacing="1.3">RAG + TOOL CALLING</text>
    <text x="50" y="154" font-size="58" font-weight="700" fill="#14293f">招聘信息助手</text>
    <text x="53" y="192" font-size="22" fill="#4c6481" letter-spacing="1.5">JOB SEARCH ASSISTANT</text>
    <text x="53" y="252" font-size="22" fill="#253d55">让招聘资料可查询、可筛选、可核对。</text>
    <path d="M54 296H630" stroke="#cad8e5"/>
    <text x="54" y="332" font-size="15" fill="#546b80">Vue 3 / FastAPI / BGE / Chroma / SQLite / DeepSeek</text>

    <rect x="745" y="49" width="476" height="308" rx="18" fill="#c5d3e0" opacity=".24"/>
    <rect x="737" y="41" width="476" height="308" rx="18" fill="#fff" stroke="#d8e3ec"/>
    <circle cx="762" cy="66" r="4" fill="#a2b5c6"/>
    <circle cx="778" cy="66" r="4" fill="#c3d1de"/>
    <circle cx="794" cy="66" r="4" fill="#dce5ed"/>
    <text x="1187" y="71" text-anchor="end" font-size="11" letter-spacing="1.2" fill="#73879a">QUERY → EVIDENCE</text>
    <path d="M737 84H1213" stroke="#e6edf3"/>
    <rect x="760" y="106" width="430" height="46" rx="9" fill="#f3f6fa"/>
    <circle cx="783" cy="127" r="6" fill="none" stroke="#58728b" stroke-width="1.8"/>
    <path d="M788 132l5 5" stroke="#58728b" stroke-width="1.8"/>
    <text x="808" y="135" font-size="17" fill="#253d55">合肥 · 实习时长不超过 3 个月</text>
    <rect x="760" y="169" width="128" height="25" rx="6" fill="#e8f5f0"/>
    <text x="774" y="186" font-family="Consolas, monospace" font-size="12" fill="#23775f">search_jobs()</text>
    <text x="760" y="234" font-size="24" font-weight="600" fill="#14293f">美的冰箱事业部</text>
    <text x="760" y="264" font-size="16" fill="#60758a">AI 应用实习生 · 每周 4 天 · 实习 3 个月</text>
    <path d="M760 285H1190" stroke="#e6edf3"/>
    <circle cx="769" cy="315" r="4" fill="#319e83"/>
    <text x="782" y="320" font-size="13" fill="#60758a">依据入库资料筛选 · 招聘信息快照</text>
  </g>
</svg>
